name: geo-explorer

# =============================================================================
# Geo-Explorer — ambiente Docker completo (desenvolvimento + utilitários)
#
# Serviços:
#   backend        -> Spring Boot no perfil padrão (API REST na :8080)
#   frontend       -> Vite dev server (hot reload) na :5173 (target `dev`)
#   frontend-prod  -> build estático servido pelo nginx (profile "prod")
#   backend-tools  -> Maven para build/testes sem Maven no host (profile "tools")
#   backend-cli    -> Spring Shell interativo (profile "cli")
#   backend-mcp    -> servidor MCP STDIO (profile "mcp")
#
# Uso:
#   cp .env.example .env
#   docker compose build
#   docker compose up -d
# =============================================================================

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: geo-explorer-backend:latest
    container_name: geo-explorer-backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - geo-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    image: geo-explorer-frontend:dev
    container_name: geo-explorer-frontend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      # Dentro da rede Docker o nome do serviço `backend` resolve para o
      # container do backend (localhost do host não funciona aqui).
      VITE_PROXY_TARGET: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - geo-net

  # Frontend de produção: build otimizado servido pelo nginx (iniciar sob demanda)
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    image: geo-explorer-frontend:prod
    container_name: geo-explorer-frontend-prod
    restart: unless-stopped
    ports:
      - "${FRONTEND_PROD_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    profiles: ["prod"]
    networks:
      - geo-net

  # Maven utilitário: roda como o UID/GID do host para não gerar artefatos root
  backend-tools:
    build:
      context: .
      dockerfile: Dockerfile.tools
    container_name: geo-explorer-backend-tools
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
    working_dir: /app
    volumes:
      - .:/app
      - m2_cache:/tmp/.m2
    profiles: ["tools"]
    networks:
      - geo-net

  # Spring Shell interativo (profile cli) — executar sob demanda com `run`
  backend-cli:
    image: geo-explorer-backend:latest
    container_name: geo-explorer-backend-cli
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    entrypoint: ["java", "-jar", "/app/app.jar", "--spring.profiles.active=cli"]
    profiles: ["cli"]
    networks:
      - geo-net

  # Servidor MCP STDIO (profile mcp) — executar sob demanda com `run`
  backend-mcp:
    image: geo-explorer-backend:latest
    container_name: geo-explorer-backend-mcp
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    entrypoint: ["java", "-jar", "/app/app.jar", "--spring.profiles.active=mcp"]
    profiles: ["mcp"]
    networks:
      - geo-net

volumes:
  frontend_node_modules:
  m2_cache:

networks:
  geo-net:
    driver: bridge
