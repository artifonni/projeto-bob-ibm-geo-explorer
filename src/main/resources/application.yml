spring:
  application:
    name: geo-explorer
  datasource:
    url: jdbc:h2:mem:geoexplorer;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    # Senha vazia — H2 em memória não possui segredo real
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false
  shell:
    noninteractive:
      # Desabilita o NonInteractiveShellRunner do Spring Shell. Ele pega todos os
      # argumentos crus de `java -jar` (ex.: --spring.profiles.active=cli) e tenta
      # executá-los como comando do shell, abortando a inicialização com
      # "CommandNotFound: No command found for '--spring.profiles.active=cli'".
      # Com isto desabilitado, o InteractiveShellRunner (profile cli) assume
      # normalmente e o profile mcp roda o transporte STDIO sem interferência.
      enabled: false
  ai:
    mcp:
      server:
        # MCP desabilitado por padrão — evita que o StdioServerTransportProvider
        # sequestre System.in nos testes da CLI e no profile cli em geral.
        # Reativado explicitamente apenas no application-mcp.yml.
        enabled: false

server:
  port: 8080
