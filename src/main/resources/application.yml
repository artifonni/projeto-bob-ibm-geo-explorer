spring:
  application:
    name: geo-explorer
  datasource:
    url: jdbc:h2:mem:geoexplorer;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    # Senha vazia — H2 em memória não possui segredo real
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: false

server:
  port: 8080
